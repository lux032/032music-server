  <!-- Mobile Top Header (visible only <= 900px in Admin Mode) -->
  <header class="mobile-admin-bar" id="mobile-admin-bar">
    <button type="button" class="icon-btn" id="mobile-admin-menu-btn" aria-label="打开管理菜单">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <span class="mobile-admin-title" id="mobile-admin-title">控制台总览</span>
    <button type="button" class="btn btn-sm btn-ghost" data-nav="home">返回音乐库</button>
  </header>

  <!-- Left Sidebar (switches cleanly between Player Mode and Admin Workspace Mode) -->
  <aside class="sidebar" id="app-sidebar" aria-label="主导航"></aside>
  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

  <!-- Main Scrollable Viewport -->
  <main class="main" id="app-main" tabindex="-1"></main>

  <!-- Right "Now Playing" Panel (Docked in Player Mode >=1440px, overlay drawer in Admin Mode / narrow viewports) -->
  <aside class="np-panel" id="np-panel" aria-label="正在播放与歌词队列"></aside>
  <div class="np-scrim" id="np-scrim" hidden></div>

  <!-- Mobile Bottom Navigation (visible <= 900px in Player Mode) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="移动导航">
    <button type="button" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>主页</span></button>
    <button type="button" data-nav="albums"><svg class="ic"><use href="#i-album"/></svg><span>专辑</span></button>
    <button type="button" data-nav="artist"><svg class="ic"><use href="#i-user"/></svg><span>歌手</span></button>
    <button type="button" data-nav="discover"><svg class="ic"><use href="#i-compass"/></svg><span>发现</span></button>
    <button type="button" data-nav="admin/dashboard"><svg class="ic"><use href="#i-settings"/></svg><span>管理</span></button>
  </nav>

  <!-- Persistent Bottom Player Bar (never stops playback when switching into Admin Mode) -->
  <footer class="player-bar" id="player-bar" role="region" aria-label="播放控制"></footer>

  <!-- Fullscreen 3-Column Editorial Stage (aligned with 032player-rs D5) -->
  <div class="fullscreen-stage" id="fullscreen-stage" role="dialog" aria-modal="true" aria-label="全屏播放" hidden></div>

  <!-- Slide-over Drawer Host (for Edit Album, Artist Correction, Track Tags, Edit Artist, Jackett Acquire, Series Detail, Translation Detail, etc.) -->
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="app-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

  <!-- Command Palette / Global Quick Search Modal (Ctrl/Cmd+K) -->
  <div class="modal-scrim" id="search-modal-scrim" hidden></div>
  <div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="搜索曲库与管理项" hidden></div>

  <!-- Toast Stack -->
  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
