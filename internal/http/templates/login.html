<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 032 Music Server</title>
  <link rel="icon" href="{{assetFaviconICO}}" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="{{assetIcon192}}" sizes="192x192">
  <link rel="apple-touch-icon" href="{{assetAppleIcon}}">
  <script src="{{assetThemeJS}}"></script>
  <link rel="stylesheet" href="{{assetTokensCSS}}">
  <link rel="stylesheet" href="{{assetBaseCSS}}">
  <link rel="stylesheet" href="{{assetShellCSS}}">
  <link rel="stylesheet" href="{{assetPagesCSS}}">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="brand-mark" src="{{assetBrandIcon}}" alt="032 Music Server" width="56" height="56">
    <p class="eyebrow">SELF-HOSTED MUSIC</p>
    <h1>音乐服务器管理面板</h1>
    <p class="muted">登录后查看服务状态、音乐库统计与扫描任务。</p>
    {{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/admin/login" class="login-form">
      {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
      <label>用户名<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
