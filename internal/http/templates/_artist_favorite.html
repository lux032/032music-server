{{define "artist-favorite"}}<form class="artist-fav-form artist-fav-form--{{.Variant}}" method="post" action="/admin/favorites/artists/{{.ID}}" data-favorite-toggle data-favorite-name="{{.Name}}"><input type="hidden" name="csrfToken" value="{{.CSRFToken}}"><input type="hidden" name="favorite" value="{{if .IsFavorite}}0{{else}}1{{end}}"><input type="hidden" name="returnTo" value="{{.ReturnTo}}"><button class="{{if eq .Variant "hero"}}secondary-button artist-fav-button{{else}}icon-action artist-fav-icon{{end}}{{if .IsFavorite}} is-favorite{{end}}" aria-pressed="{{if .IsFavorite}}true{{else}}false{{end}}" title="{{if .IsFavorite}}取消收藏{{else}}加入收藏{{end}}" aria-label="{{if .IsFavorite}}取消收藏{{else}}收藏{{end}} {{.Name}}"><svg class="icon" aria-hidden="true"><use href="{{assetIconsSVG}}#{{if .IsFavorite}}icon-heart-fill{{else}}icon-heart{{end}}"></use></svg>{{if eq .Variant "hero"}}<span class="fav-label">{{if .IsFavorite}}已收藏{{else}}收藏{{end}}</span>{{end}}</button></form>{{end}}
