name: Go race

# Race-detector run for the concurrency-sensitive packages (credential hot
# swap, session revocation, SQLite retry layer). -race needs cgo and a C
# toolchain, which the Linux runner provides.
#
# Performance SLA tests are behind the "performance" build tag and are NOT
# compiled here (no -tags=performance): -race instrumentation slows code
# several-fold, so timing thresholds are meaningless under it. This job only
# fails on test failures, panics, detected data races or build errors.
# Performance SLAs run in go-performance.yml without -race.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-race-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  race:
    name: Race detector tests (${{ matrix.package }} ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # -race slows these SQLite-heavy suites 5-10x (unsharded: http ~23m,
    # storage ~34m). Every test still runs: each package's tests are split
    # round-robin across 6 shards, each on its own runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - http
          - storage
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Race tests (excludes performance-tagged tests)
        env:
          CGO_ENABLED: "1"
          PKG: ./internal/${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
          SHARDS: "6"
        run: |
          set -euo pipefail
          # -race on -list so the instrumented build is cached for the run.
          go test -race -list '.*' "$PKG" | grep -E '^(Test|Example|Fuzz)' | sort > all-tests.txt
          awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i' all-tests.txt > shard-tests.txt
          echo "Running $(wc -l < shard-tests.txt) of $(wc -l < all-tests.txt) tests"
          if [ ! -s shard-tests.txt ]; then exit 0; fi
          go test -race -count=1 -timeout=25m -run "^($(paste -sd'|' shard-tests.txt))\$" "$PKG"
